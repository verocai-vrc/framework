# Neo4j Community 5.26 LTS with the free APOC and Graph Data Science plugins.
# Data persists in the named volume `neo4j_data`; `make reset` wipes the graph, not the volume.
services:
  neo4j:
    image: neo4j:5.26.30-community
    container_name: osintree-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # Neo4j Browser (http://localhost:7474)
      - "7687:7687"   # Bolt (used by the backend)
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-osintree-dev}"
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*,gds.*"
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "1G"
      NEO4J_server_memory_pagecache_size: "256m"
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  neo4j_data:
  neo4j_logs:
