name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --extra dev --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest -q -m "not neo4j"

  integration:
    runs-on: ubuntu-latest
    needs: lint-and-unit
    services:
      neo4j:
        image: neo4j:5.26.30-community
        env:
          NEO4J_AUTH: neo4j/osintree-dev
          NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
          NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"
          NEO4J_dbms_security_procedures_allowlist: "apoc.*,gds.*"
          NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 20 --health-start-period 40s
    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: osintree-dev
      PASSIVE_ONLY: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --extra dev --frozen
      # Plugins load after the container health check passes: wait until the engine
      # can apply the schema, then run the full suite (integration tests must not skip).
      - run: |
          for i in $(seq 1 30); do
            uv run osintree schema && exit 0 || sleep 5
          done
          echo "Neo4j never became reachable" && exit 1
      - run: uv run pytest -q
        env:
          OSINTREE_REQUIRE_NEO4J: "1"
