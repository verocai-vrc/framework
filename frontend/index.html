<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OSINTree — Attack Surface Mapper</title>
  <link rel="stylesheet" href="vendor/fonts.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">◉</span>
    <span class="brand-name" data-i18n="app.name">OSINTree</span>
  </div>
  <div class="topbar-center" id="project-switcher">
    <label class="inline-label" for="project-select" data-i18n="project.label">Project</label>
    <select id="project-select" class="select-compact"></select>
    <button id="btn-new-project" class="btn-sm" data-i18n="project.new">＋ New project</button>
    <button id="btn-project-settings" class="btn-sm btn-icon" data-i18n-title="project.settings" title="Project settings">⚙</button>
  </div>
  <div class="topbar-right">
    <select id="locale-select" class="select-compact select-locale" data-i18n-title="locale.tip" title="Interface language">
      <option value="en">EN</option>
      <option value="pt">PT</option>
    </select>
    <span class="badge badge-guard" id="badge-passive" data-i18n-title="guard.tooltip">
      <span data-i18n="guard.passive">passive-only</span>
    </span>
    <span class="badge badge-health" id="badge-health" data-state="unknown">
      <span class="dot"></span>
      <span id="badge-health-text" data-i18n="health.checking">checking…</span>
    </span>
  </div>
</header>

<div class="app-container">

  <!-- Left column: graph canvas + tools/collectors -->
  <div class="left-column">
    <section class="panel graph-panel">
      <div id="network"></div>
      <div class="graph-toolbar" id="graph-toolbar">
        <button id="btn-add-node" data-i18n="graph.add_node">＋ Node</button>
        <button id="btn-add-edge" data-i18n="graph.add_edge">→ Edge</button>
        <button id="btn-delete" data-i18n="graph.delete" disabled>🗑 Delete</button>
        <button id="btn-layout" data-i18n="graph.layout" data-i18n-title="graph.layout_tip" title="Re-run the layout (double-click the canvas to fit)">⟳ Layout</button>
        <button id="btn-cluster" data-i18n="graph.cluster" data-i18n-title="graph.cluster_tip" title="Collapse each axis into one node; click a cluster to open it">⊞ Axes</button>
      </div>
      <details class="legend" id="legend" open>
        <summary data-i18n="legend.title">Legend</summary>
        <div id="legend-body"></div>
      </details>
      <div class="mode-hint" id="mode-hint" hidden></div>
      <div class="empty-state" id="graph-empty">
        <p data-i18n="graph.empty">No graph yet. Create a project and add your first node.</p>
      </div>
    </section>

    <section class="panel tools-panel">
      <div class="tools-head">
        <div class="seg seg-tabs" id="tools-tabs">
          <button data-tab="collectors" class="on" data-i18n="tools.tab_collectors">Collectors</button>
          <button data-tab="analysis" data-i18n="tools.tab_analysis">Analysis</button>
        </div>
        <div class="io-actions">
          <button id="btn-review" class="btn-sm btn-review" data-i18n="review.button0">Review queue</button>
          <button id="btn-export" class="btn-sm" data-i18n="io.export">↓ Export JSON</button>
          <button id="btn-import" class="btn-sm" data-i18n="io.import">↑ Import JSON</button>
          <input type="file" id="input-import" accept=".json,application/json" hidden>
        </div>
      </div>
      <div id="tools-body"></div>
      <div id="analysis-body" hidden></div>
    </section>
  </div>

  <!-- Right: entity editor -->
  <aside class="panel editor-panel">
    <div id="editor-placeholder" class="empty-state">
      <p data-i18n="editor.placeholder">Select a node in the graph to edit its details.</p>
    </div>
    <div id="editor-content" hidden></div>
  </aside>

</div>

<!-- Generic modal host: forms are rendered into it by js/modals.js -->
<div class="modal-overlay" id="modal-overlay" hidden>
  <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
</div>

<div id="toast-host" class="toast-host" aria-live="polite"></div>

<script src="vendor/vis-network.min.js"></script>
<script src="vendor/marked.umd.js"></script>
<script src="js/i18n.js"></script>
<script src="js/api.js"></script>
<script src="js/schema.js"></script>
<script src="js/modals.js"></script>
<script src="js/graph.js"></script>
<script src="js/editor.js"></script>
<script src="js/collectors.js"></script>
<script src="js/review.js"></script>
<script src="js/analysis.js"></script>
<script src="js/app.js"></script>
</body>
</html>
